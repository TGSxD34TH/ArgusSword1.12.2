name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          ls -la
          f=$(find . -iname '*source*.zip' | head -n 1)
          echo "Found archive: $f"
          if [ -n "$f" ]; then unzip -o "$f"; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.9
      - run: gradle setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ArgusSword-jar
          path: build/libs/*.jar
